[package]
name = "lazr"
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
description = "RAD для Rust, заточенный под ИИ: модель экрана → настоящий egui-код, сборка и headless-проверка"
license = "MIT"
repository = "https://github.com/kostyk348/lazr"
homepage = "https://kostyk348.github.io/lazr/"
readme = "README.md"
keywords = ["gui", "egui", "codegen", "rad", "ui-model"]
categories = ["gui", "development-tools"]

[dependencies]

[[bin]]
name = "lazr"
path = "src/main.rs"
