name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: форматирование
        run: cargo fmt --all -- --check
      - name: тесты (модель, ошибки, генерация)
        run: cargo test
      - name: модель → код (без сборки egui, быстро)
        run: |
          cargo run -q -- new /tmp/ci-app --title "CI" --size 320x200
          cargo run -q -- state /tmp/ci-app count int 0
          cargo run -q -- add /tmp/ci-app label "Нажатий: {count}"
          cargo run -q -- add /tmp/ci-app button "Плюс" --do "count += 1"
          cargo run -q -- show /tmp/ci-app
          test -f /tmp/ci-app/app/src/main.rs
          grep -q 'fn action_0' /tmp/ci-app/app/src/main.rs
          grep -q 'action_0(state);' /tmp/ci-app/app/src/main.rs
      - name: иконки и горячие клавиши в коде
        run: |
          cargo run -q -- add /tmp/ci-app button "Сохранить" --do "count = 0" --style "icon:save, key:ctrl+s"
          grep -q 'fn shortcut' /tmp/ci-app/app/src/main.rs
          grep -q 'if shortcut(ui, "ctrl+s")' /tmp/ci-app/app/src/main.rs
          grep -q '💾' /tmp/ci-app/app/src/main.rs
      - name: place, тема и упаковка
        run: |
          cargo run -q -- lisp examples/dashboard.lisp --to /tmp/ci-dash
          grep -q 'place 800x480' /tmp/ci-dash/form.lazr
          grep -q 'at 16 50' /tmp/ci-dash/form.lazr
          grep -q 'anchor right bottom' /tmp/ci-dash/form.lazr
          grep -q 'fn apply_theme' /tmp/ci-dash/app/src/main.rs
          grep -q 'ThemePreference::Dark' /tmp/ci-dash/app/src/main.rs
          grep -q 'UiBuilder::new().max_rect' /tmp/ci-dash/app/src/main.rs
      - name: упаковка собирает dist
        run: |
          # в CI реестр пустой: сначала тянем зависимости, потом собираем офлайн
          cargo fetch --manifest-path /tmp/ci-dash/app/Cargo.toml || cargo fetch --manifest-path /tmp/ci-dash/app/Cargo.toml
          cargo run -q -- package /tmp/ci-dash
          # заголовок модели «Пульт» → имя пакета pult (транслитерация)
          test -f /tmp/ci-dash/dist/pult
          test -f /tmp/ci-dash/dist/pult.desktop
          test -f /tmp/ci-dash/dist/icon.svg
          test -f /tmp/ci-dash/dist/pult-debug.tar.gz
          grep -q 'Name=Пульт' /tmp/ci-dash/dist/pult.desktop
      - name: рантайм live собирается и читает модель
        run: |
          cargo run -q -- live examples/live-demo.lazr --headless
      - name: модель с ошибками отвергается с кодом 1
        run: |
          printf 'window "bad" 300x200\nvbox\n  frobnicator "нет"\n' > /tmp/bad.lazr
          if cargo run -q -- live /tmp/bad.lazr --problems; then
            echo "ожидали код 1 для модели с ошибкой"; exit 1
          fi
          cargo run -q -- live examples/live-demo.lazr --problems
      - name: действия в рантайме применяются (--check)
        run: |
          cargo run -q -- live examples/live-demo.lazr --check | tee /tmp/live-check.txt
          grep -q 'count: 0 → 1' /tmp/live-check.txt
          grep -q 'check ok: действий 3' /tmp/live-check.txt
      - name: when скрывает и показывает панели (рантайм)
        run: |
          mkdir -p /tmp/when-ci
          printf '(window "A" 300 200)\n(state v int 5)\n(vbox\n  (when (> v 2) (label "видно")))\n' > /tmp/when-ci/yes.lisp
          printf '(window "A" 300 200)\n(vbox\n  (when (> v 99) (label "не видно")))\n' > /tmp/when-ci/no.lisp
          cargo run -q -- live /tmp/when-ci/yes.lisp --headless | tee /tmp/when-ci/yes.txt
          cargo run -q -- live /tmp/when-ci/no.lisp --headless | tee /tmp/when-ci/no.txt
          grep -q '1 фигур' /tmp/when-ci/yes.txt
          grep -q '0 фигур' /tmp/when-ci/no.txt
      - name: when превращается в if (генератор)
        run: |
          mkdir -p /tmp/when-gen
          printf 'state value int 5\nwhen value > 2\n  label "видно"\n' > /tmp/when-gen/form.lazr
          printf 'window "A" 300 200\n' | cat - /tmp/when-gen/form.lazr > /tmp/when-gen/full.lazr
          mv /tmp/when-gen/full.lazr /tmp/when-gen/form.lazr
          cargo run -q -- build /tmp/when-gen
          cargo run -q -- headless /tmp/when-gen | tee /tmp/when-gen/out.txt
          # фон окна рисует сама программа, поэтому фигур на одну больше
          grep -q '2 фигур' /tmp/when-gen/out.txt
      - name: состояние между запусками (два прогона)
        run: |
          rm -rf /tmp/store-ci && mkdir -p /tmp/store-ci
          printf 'window "Х" 320 220\nstore "/tmp/store-ci/s.store"\nstate count int 0\nbutton "п" do count += 1\n' > /tmp/store-ci/form.lazr
          cargo run -q -- build /tmp/store-ci
          cargo run -q -- verify /tmp/store-ci | tee /tmp/store-ci/first.txt
          grep -q 'count: 0 → 1' /tmp/store-ci/first.txt
          test "$(cut -f2 /tmp/store-ci/s.store | head -1)" = "1"
          cargo run -q -- verify /tmp/store-ci | tee /tmp/store-ci/second.txt
          grep -q 'count: 1 → 2' /tmp/store-ci/second.txt
          test "$(cut -f2 /tmp/store-ci/s.store | head -1)" = "2"
      - name: свой шрифт, моно и подсказки (генератор)
        run: |
          mkdir -p /tmp/font-ci
          printf 'window "Ш" 420 260\nfont-family "/usr/share/fonts/TTF/DejaVuSansMono.ttf"\nlabel "код 123" {mono, hint:"подсказка при наведении"}\nbutton "к" do n += 1 {hint:"нажми"}\nstate n int 0\n' > /tmp/font-ci/form.lazr
          cargo run -q -- build /tmp/font-ci
          grep -q 'fn apply_ui_font' /tmp/font-ci/app/src/main.rs
          grep -q 'monospace()' /tmp/font-ci/app/src/main.rs
          grep -q 'on_hover_text' /tmp/font-ci/app/src/main.rs
          cargo run -q -- headless /tmp/font-ci
          cargo run -q -- live /tmp/font-ci/form.lazr --problems | grep -q 'problems: 0'
      - name: своя рамка окна (генератор)
        run: |
          mkdir -p /tmp/frame-ci
          printf 'window "Р" 420 300 chrome:own topmost:yes min:360x240\nstate n int 0\nlabel "тело"\n' > /tmp/frame-ci/form.lazr
          cargo run -q -- build /tmp/frame-ci
          grep -q 'with_decorations(false)' /tmp/frame-ci/app/src/main.rs
          grep -q 'fn titlebar(ui: &mut egui::Ui' /tmp/frame-ci/app/src/main.rs
          grep -q 'with_window_level(egui::WindowLevel::AlwaysOnTop)' /tmp/frame-ci/app/src/main.rs
          cargo run -q -- headless /tmp/frame-ci
          cargo run -q -- live /tmp/frame-ci/form.lazr --problems | grep -q 'problems: 0'
      - name: внешние иконки и карточки (кодогенерация)
        run: |
          mkdir -p /tmp/icons-ci
          printf 'window "И" 400 300\nicon-font "/usr/share/fonts/TTF/fa-solid-900.ttf"\nstate n int 0\ncard\n  hbox\n    icon "\\uf00c"\n    label "готово"\n' > /tmp/icons-ci/form.lazr
          cargo run -q -- build /tmp/icons-ci
          grep -q 'add_font' /tmp/icons-ci/app/src/main.rs
          grep -q 'FontFamily::Name("icons"' /tmp/icons-ci/app/src/main.rs
          grep -q 'card_frame(ui,' /tmp/icons-ci/app/src/main.rs
          cargo run -q -- headless /tmp/icons-ci
      - name: icon без icon-font — понятная ошибка
        run: |
          mkdir -p /tmp/icon-bad
          printf 'window "И" 400 300\nicon "\\uf00c"\n' > /tmp/icon-bad/form.lazr
          if cargo run -q -- build /tmp/icon-bad > /tmp/icon-bad/out.txt 2>&1; then
            echo "ожидали ошибку, а сборка прошла"
            exit 1
          fi
          grep -q 'icon-font' /tmp/icon-bad/out.txt
      - name: шаблон строки и начальные элементы
        run: |
          mkdir -p /tmp/row-ci
          printf 'window "С" 420 300\nstate items list "молоко,хлеб"\nvbox\n  list -> items "пусто"\n    hbox\n      label "• {item}"\n      button "убрать" do remove items\n' > /tmp/row-ci/form.lazr
          cargo run -q -- build /tmp/row-ci
          cargo run -q -- headless /tmp/row-ci | tee /tmp/row-ci/out.txt
          # +1 — фон окна
          grep -q '7 фигур' /tmp/row-ci/out.txt
          cargo run -q -- live /tmp/row-ci/form.lazr --headless | tee /tmp/row-ci/live.txt
          grep -q '6 фигур' /tmp/row-ci/live.txt
      - name: «remove items» вне шаблона — понятная ошибка
        run: |
          mkdir -p /tmp/row-bad
          printf 'window "С" 420 300\nstate items list\nbutton "x" do remove items\n' > /tmp/row-bad/form.lazr
          if cargo run -q -- build /tmp/row-bad > /tmp/row-bad/out.txt 2>&1; then
            echo "ожидали ошибку, а сборка прошла"
            exit 1
          fi
          grep -q 'шаблоне строки' /tmp/row-bad/out.txt
      - name: списки работают в сгенерированном приложении
        run: |
          cargo run -q -- lisp examples/todo.lisp --to /tmp/ci-todo
          cargo run -q -- verify /tmp/ci-todo | tee /tmp/ci-todo.txt
          grep -q 'items: \[\] → ' /tmp/ci-todo.txt
          grep -q 'items: \[\"\"\] → \[\]' /tmp/ci-todo.txt
      - name: списки работают и в рантайме
        run: |
          cargo run -q -- live examples/todo.lisp --check | tee /tmp/ci-todo-live.txt
          grep -q 'items: 0 → 1' /tmp/ci-todo-live.txt
          grep -q 'items: 1 → 0' /tmp/ci-todo-live.txt
      - name: каждая модель .lazr собирается и проходит verify
        run: |
          for model in examples/*.lazr; do
            name=$(basename "$model" .lazr)
            dir=/tmp/build-$name
            rm -rf "$dir" && mkdir -p "$dir"
            cp "$model" "$dir/form.lazr"
            cargo run -q -- build "$dir"
            cargo run -q -- verify "$dir" | tail -2
          done
      - name: модели отформатированы (lazr fmt --check)
        run: |
          for model in examples/*.lazr; do
            cargo run -q -- fmt "$model" --check
          done
      - name: все демки чистые (--problems = 0)
        run: |
          for model in examples/*.lisp examples/*.lazr; do
            echo "— $model"
            cargo run -q -- live "$model" --problems
          done
      - name: S-выражения исполняются без конвертации
        run: |
          cargo run -q -- live examples/live-demo.lisp --check | tee /tmp/sexpr-check.txt
          grep -q 'count: 0 → 1' /tmp/sexpr-check.txt
          cargo run -q -- live examples/live-demo.lisp --problems
          cargo run -q -- live examples/paint.lisp --problems
      - name: место, тема и арифметика в рантайме
        run: |
          cargo run -q -- live examples/dashboard.lazr --check | tee /tmp/dash-check.txt
          grep -q 'refreshed: 0 → 1' /tmp/dash-check.txt
          cargo run -q -- live examples/dashboard.lazr --problems
          printf 'window "a" 200x120\nstate x int 1\nstate k int 4\nvbox\n  button "b" do x = x + k\n' > /tmp/arith.lazr
          cargo run -q -- live /tmp/arith.lazr --check | tee /tmp/arith-check.txt
          grep -q 'x: 1 → 5' /tmp/arith-check.txt
      - name: S-выражения и пример Paint разбираются
        run: |
          cargo run -q -- lisp examples/paint.lisp > /tmp/paint.lazr
          grep -q 'rust field strokes' /tmp/paint.lazr
          grep -q 'custom canvas' /tmp/paint.lazr
          cargo run -q -- lisp examples/paint.lisp --to /tmp/paint-ci
          grep -q 'fn widget_canvas' /tmp/paint-ci/app/src/main.rs
          grep -q 'fn shortcut' /tmp/paint-ci/app/src/main.rs
