<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="lazr">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="0.55" stop-color="#f2751f"/>
      <stop offset="1" stop-color="#d93636"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69b4ff"/>
      <stop offset="1" stop-color="#2f6fd0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="512" rx="104" fill="url(#grid)"/>

  <!-- окно: HAL -->
  <rect x="64" y="64" width="384" height="384" rx="56" fill="none" stroke="#233043" stroke-width="6"/>
  <path d="M64 128h384" stroke="#233043" stroke-width="6"/>
  <circle cx="96" cy="96" r="8" fill="#3a4a63"/>
  <circle cx="124" cy="96" r="8" fill="#3a4a63"/>
  <circle cx="152" cy="96" r="8" fill="#3a4a63"/>

  <!-- скобки: S-выражения -->
  <path d="M196 176c-22 0-34 14-34 34v92c0 20-12 34-34 34" fill="none" stroke="url(#wire)"
        stroke-width="14" stroke-linecap="round"/>
  <path d="M316 176c22 0 34 14 34 34v92c0 20 12 34 34 34" fill="none" stroke="url(#wire)"
        stroke-width="14" stroke-linecap="round"/>

  <!-- лямбда: DSL -->
  <g filter="url(#glow)">
    <path d="M256 336V200c0-14 8-24 22-24h14" fill="none" stroke="url(#flame)"
          stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M222 236l34-14 30 114" fill="none" stroke="url(#flame)"
          stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- курсор: правка модели -->
  <rect x="286" y="352" width="44" height="8" rx="4" fill="#2f6fd0" opacity="0.9"/>
</svg>
